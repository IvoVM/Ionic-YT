
  <ion-tabs>
    <ion-tab-bar slot="bottom">

      <ion-tab-button tab="home">
        <ion-icon name="home"></ion-icon>
        <ion-label>Home</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="shorts">
        <ion-icon name="play"></ion-icon>
        <ion-label>Shorts</ion-label>
      </ion-tab-button>

      <ion-tab-button (click)="openModal()">
        <ion-icon
          class="h-7 w-7 rounded-full border border-white p-1 text-2xl"
          name="add">
        </ion-icon>
      </ion-tab-button>

      <ion-tab-button tab="subscriptions">
        <ion-icon name="albums"></ion-icon>
        <ion-label>Subscriptions</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="library">
        <ion-icon name="library"></ion-icon>
        <ion-label>Library</ion-label>
      </ion-tab-button>

    </ion-tab-bar>

  </ion-tabs>
<app-create-modal  (close)="this.isModalOpen.set(false)" [isModalOpen]="isModalOpen()"></app-create-modal>
